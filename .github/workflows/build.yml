name: Speakly Build CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      # 1. Полностью создаем чистый каркас для Android и Web
      - name: Recreate Android and Web platforms
        run: |
          rm -rf android web
          flutter create . --project-name=speakly --platforms=android,web --org=com.speakly

      # 2. Надежная настройка minSdk 23 и FlutterFragmentActivity
      - name: Configure Android SDK settings
        run: |
          # Настройка minSdk в build.gradle (Groovy) если он есть
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle
          fi

          # Настройка minSdk в build.gradle.kts (Kotlin DSL) если он есть
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle.kts
          fi

          # Настройка FlutterFragmentActivity для работы биометрии
          find android/app/src -type f \( -name "MainActivity.kt" -o -name "MainActivity.java" \) | while read file; do
            sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$file"
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/g' "$file"
          done

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: speakly-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speakly-web-build
          path: build/web
