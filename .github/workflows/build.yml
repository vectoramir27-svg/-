name: Speakly Build CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Recreate Platforms
        run: |
          rm -rf android web
          flutter create . --project-name=speakly --platforms=android,web --org=com.speakly

      - name: Patch Android Config
        run: |
          python3 -c "
          import os

          # 1. Патчим build.gradle или build.gradle.kts
          for root, dirs, files in os.walk('android/app'):
              for f in files:
                  if f in ['build.gradle', 'build.gradle.kts']:
                      p = os.path.join(root, f)
                      with open(p, 'r') as file:
                          c = file.read()
                      c = c.replace('flutter.minSdkVersion', '23').replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
                      with open(p, 'w') as file:
                          file.write(c)

          # 2. Патчим MainActivity под FlutterFragmentActivity для биометрии
          for root, dirs, files in os.walk('android/app/src'):
              for f in files:
                  if f.startswith('MainActivity'):
                      p = os.path.join(root, f)
                      with open(p, 'r') as file:
                          c = file.read()
                      c = c.replace('FlutterActivity', 'FlutterFragmentActivity')
                      c = c.replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterFragmentActivity')
                      with open(p, 'w') as file:
                          file.write(c)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: speakly-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speakly-web-build
          path: build/web
